name: Verify published v0.2.2

on:
  push:
    branches:
      - fix/issue-22-toolkit-6
    paths:
      - .github/workflows/publish-validated-release.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download published assets
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/taotaozsky2025-beep/zotero-var-highlighter/releases/download/v0.2.2/zotero-var-highlighter.xpi" \
            --output "$RUNNER_TEMP/zvh.xpi"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/taotaozsky2025-beep/zotero-var-highlighter/releases/download/release/update.json" \
            --output "$RUNNER_TEMP/update.json"
      - name: Verify downloaded XPI and update index
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile

          temporary = Path(os.environ["RUNNER_TEMP"])
          package = temporary / "zvh.xpi"
          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          assert actual == "017a2a27966479f31292905c83d46fc443f74e4f7f2ee9e6eb2dd06c1dd1be79"
          update_url = "https://github.com/taotaozsky2025-beep/zotero-var-highlighter/releases/download/release/update.json"
          with zipfile.ZipFile(package) as archive:
              manifest = json.loads(archive.read("manifest.json"))
              assert manifest["version"] == "0.2.2"
              assert manifest["applications"]["zotero"]["update_url"] == update_url
              script = archive.read("content/scripts/zotero-var-highlighter.js").decode("utf-8")
              assert "zotero://plugin" not in script
              assert "zotero://ztoolkit-debug" not in script
          index = json.loads((temporary / "update.json").read_text(encoding="utf-8"))
          updates = index["addons"]["zotero-var-highlighter@zotero-var-highlighter"]["updates"]
          current = [update for update in updates if update["version"] == "0.2.2"]
          assert len(current) == 1
          assert current[0]["update_link"] == "https://github.com/taotaozsky2025-beep/zotero-var-highlighter/releases/download/v0.2.2/zotero-var-highlighter.xpi"
          print("Published XPI SHA256:", actual)
          print("Published update index:", json.dumps(index, ensure_ascii=False))
          print("Published assets verified successfully.")
          PY

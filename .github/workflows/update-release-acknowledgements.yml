name: Update v0.2.2 acknowledgements

on:
  push:
    branches:
      - fix/issue-22-toolkit-6
    paths:
      - .github/workflows/update-release-acknowledgements.yml

permissions:
  contents: write

jobs:
  acknowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add acknowledgement to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.2.2 --repo taotaozsky2025-beep/zotero-var-highlighter --json body --jq '.body' > "$RUNNER_TEMP/release-notes.md"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          notes = path.read_text(encoding="utf-8")
          section = "### 🙏 Acknowledgements\n\nSpecial thanks to [Ilias Beshimov (@iliasbeshimov)](https://github.com/iliasbeshimov), creator of [Zotero Plugins Atlas](https://zoteroplugins.org), for reporting the unused toolkit debug-protocol handlers in [#22](https://github.com/taotaozsky2025-beep/zotero-var-highlighter/issues/22) and providing clear guidance on upgrading to toolkit 6."
          if section not in notes:
              notes = notes.rstrip() + "\n\n" + section + "\n"
          path.write_text(notes, encoding="utf-8")
          PY
          gh release edit v0.2.2 --repo taotaozsky2025-beep/zotero-var-highlighter --notes-file "$RUNNER_TEMP/release-notes.md"
